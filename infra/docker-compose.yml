# 금융 인텔리전스 플랫폼 - 로컬 인프라
# 사용: docker compose -f infra/docker-compose.yml up -d
version: "3.8"

services:
  # ---------- 원천 DB (CDC 소스) ----------
  postgres:
    image: postgres:16
    container_name: fin-postgres
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
      POSTGRES_DB: findb
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"        # CDC 핵심: 논리 복제 활성화
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ---------- Kafka (KRaft 모드, zookeeper 불필요) ----------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fin-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "fin-cluster-0000000000"

  # ---------- Kafka Connect + Debezium ----------
  connect:
    image: debezium/connect:2.7
    container_name: fin-connect
    depends_on: [kafka, postgres]
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "fin-connect"
      CONFIG_STORAGE_TOPIC: "_connect_configs"
      OFFSET_STORAGE_TOPIC: "_connect_offsets"
      STATUS_STORAGE_TOPIC: "_connect_status"
      KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  # ---------- 지식 그래프 ----------
  neo4j:
    image: neo4j:5.21
    container_name: fin-neo4j
    ports:
      - "7474:7474"   # 브라우저 UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/password"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
